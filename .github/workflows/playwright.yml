name: Playwright E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-playwright

      - name: Run unit tests
        env:
          MOCK_LLM: "1"
        run: pytest tests/test_agent_unit.py -m unit -v

  e2e-tests:
    name: E2E Playwright Tests
    runs-on: ubuntu-latest
    needs: unit-tests          # only run e2e if unit tests pass
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest pytest-playwright

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run smoke tests
        env:
          MOCK_LLM: "1"
        run: pytest tests/test_ui.py -m smoke -v

      - name: Run full E2E tests
        env:
          MOCK_LLM: "1"
        run: >
          pytest tests/test_ui.py -m e2e -v
          --tracing=retain-on-failure
          --screenshot=only-on-failure
          --video=retain-on-failure

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            *.zip
          retention-days: 7
