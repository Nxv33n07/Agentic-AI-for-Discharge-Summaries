services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MOCK_LLM=${MOCK_LLM:-1}
    volumes:
      - ./output:/app/output

  ui:
    build: .
    command: streamlit run ui/streamlit/app.py --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - MOCK_LLM=${MOCK_LLM:-1}
    volumes:
      - ./output:/app/output
