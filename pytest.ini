[pytest]
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    smoke: Quick sanity checks — page loads and basic UI presence
    e2e: Full end-to-end browser flows via Playwright
    unit: Pure-Python tests with no browser or LLM dependency

# Playwright options
# Base URL is set dynamically in conftest.py — override here if needed
# browser = chromium
# headed = false
